<circle cx="50" cy="50" r="38" fill="none" stroke="#FB923C" stroke-width="0.3"></circle>

<main style="position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; padding: 56px 32px; gap: 28px">

<a href="Main.html" aria-current="page" style="display: inline-flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 999px; background: #FDBA74; color: #7C2D12; font-weight: 800; font-size: 16px; text-decoration: none">Inloggen</a>
<a href="Registreren.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 999px; color: #7C2D12; font-weight: 700; font-size: 16px; text-decoration: none">Account maken</a>

<form style="width: 100%; max-width: 520px; box-sizing: border-box; background: #FFF7ED; border: 2px solid #FDBA74; border-radius: 24px; padding: 40px; display: flex; flex-direction: column; gap: 16px">
<div>

</div>
<label for="mail" style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9A4A22">E-mailadres</label>
<input id="mail" type="email" autocomplete="email" value="j.devries@hu.nl" style="box-sizing: border-box; width: 100%; min-height: 58px; margin-top: -8px; padding: 0 18px; border: 3px solid #C2410C; border-radius: 14px; background: #FFFFFF; color: #7C2D12; font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 20px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
<label for="pw" style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9A4A22">Wachtwoord</label>
<a href="#" style="font-size: 15px; font-weight: 700">Wachtwoord vergeten?</a>
</div>
<div style="position: relative; margin-top: -8px">
<input id="pw" type="password" autocomplete="current-password" value="geheim123" style="box-sizing: border-box; width: 100%; min-height: 58px; padding: 0 64px 0 18px; border: 2px solid #FDBA74; border-radius: 14px; background: #FFFFFF; color: #7C2D12; font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 20px">
<button type="button" onClick="() => this.setState({ showPw: !showPw })" aria-label="Wachtwoord tonen" style="position: absolute; right: 7px; top: 7px; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: #FFEDD5; color: #7C2D12; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
<label style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font-size: 16px; font-weight: 500"><input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #C2410C; margin: 0">Ingelogd blijven op dit apparaat</label>

<a href="Account-Student.html" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; box-sizing: border-box; min-height: 58px; padding: 0 32px; width: 100%; border-radius: 999px; background: #FDBA74; color: #7C2D12; font-weight: 800; font-size: 20px; text-decoration: none">Inloggen als student</a>
<a href="Admin-Overzicht.html" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; box-sizing: border-box; min-height: 58px; padding: 0 32px; width: 100%; border-radius: 999px; border: 2px solid #9A4A22; color: #7C2D12; font-weight: 700; font-size: 18px; text-decoration: none">Inloggen als docent (demo)</a>
<p style="margin: 4px 0 0; text-align: center; font-size: 15px; color: #9A4A22">Nog geen account? <a href="Registreren.html" style="font-weight: 700">Maak er een</a></p>
</form>
<p style="margin: 0; max-width: 520px; text-align: center; font-size: 15px; line-height: 1.5; color: #9A4A22">Alleen meedoen aan een quiz? Daar heb je geen account voor nodig.</p>
</main>
</div>
