<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Eindscherm speler</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Barlow:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111318}
a{color:#F2F0EA}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 1240px; box-sizing: border-box; background: #111318; color: #F2F0EA; font-family: 'Barlow', sans-serif; padding: 24px 16px 32px; display: flex; flex-direction: column">

<header style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid #2A2E37">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase">Open ICT Quiz</span>
<span style="font-size: 14px; color: #A3A8B3">Code <strong style="color: #F2F0EA; font-weight: 600">482913</strong></span>
</header>

<section aria-labelledby="jij-titel" style="display: flex; flex-direction: column; gap: 8px; padding: 32px 0 28px">
<p id="jij-titel" style="margin: 0; font-size: 16px; color: #A3A8B3">{{me.nickname}}, je bent geëindigd op</p>
<div style="display: flex; align-items: flex-end; gap: 12px">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 144px; line-height: 0.8; color: {{accent}}">{{me.rank}}e</span>
<span style="font-size: 18px; color: #A3A8B3; padding-bottom: 6px">van {{count}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 20px">
<div style="background: #1C1F26; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; color: #A3A8B3; text-transform: uppercase; letter-spacing: 0.08em">Punten</span>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 32px; font-variant-numeric: tabular-nums">{{me.scoreText}}</span>
</div>
<div style="background: #1C1F26; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; color: #A3A8B3; text-transform: uppercase; letter-spacing: 0.08em">Goed</span>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 32px; font-variant-numeric: tabular-nums">{{me.correctText}}</span>
</div>
</div>
<p style="margin: 8px 0 0; font-size: 14px; color: #A3A8B3">Je speelt als gast: je score wordt na de quiz gewist.</p>
</section>

<section aria-labelledby="lijst-titel" style="display: flex; flex-direction: column">
<h2 id="lijst-titel" style="margin: 0 0 8px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: 0.04em">Ranglijst</h2>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<li style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 12px; border-top: 1px solid #2A2E37; background: {{r.bg}}; color: {{r.fg}}">
<span style="width: 28px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px">{{r.rank}}</span>
<span style="flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere">{{r.nickname}}</span>
<span style="font-variant-numeric: tabular-nums; font-weight: 600">{{r.scoreText}}</span>
</li>
</sc-for>
</ol>
</section>

<div style="display: flex; flex-direction: column; gap: 10px; margin-top: auto; padding-top: 28px">
<button type="button" style="min-height: 52px; border: 0; background: {{accent}}; color: #111318; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; text-transform: uppercase; letter-spacing: 0.04em">Account maken en score bewaren</button>
<button type="button" style="min-height: 52px; border: 2px solid #F2F0EA; background: transparent; color: #F2F0EA; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; text-transform: uppercase; letter-spacing: 0.04em">Terug naar start</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFD23F","options":["#FFD23F","#FF8A3D","#5CC8FF"]},"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FFD23F';
    const results = [
      { id: 1, nickname: 'Sanne', score: 7420, correct: 8 },
      { id: 2, nickname: 'Daan', score: 5310, correct: 6 },
      { id: 3, nickname: 'Fatima', score: 6150, correct: 7 },
      { id: 4, nickname: 'Lucas', score: 2890, correct: 4 },
      { id: 5, nickname: 'Noah', score: 4480, correct: 5 },
      { id: 6, nickname: 'Mo', score: 6150, correct: 7 },
      { id: 7, nickname: 'Emma', score: 3720, correct: 5 },
      { id: 8, nickname: 'quizkoning', score: 1540, correct: 2 },
      { id: 9, nickname: 'Yara', score: 5880, correct: 7 },
      { id: 10, nickname: 'Tim_04', score: 0, correct: 0 }
    ];
    const meId = 7;
    const sorted = results.slice().sort((a, b) => b.score - a.score || a.nickname.localeCompare(b.nickname));
    const ranked = sorted.map((r) => ({ ...r, rank: sorted.findIndex((o) => o.score === r.score) + 1 }));
    const fmt = (n) => n.toLocaleString('nl-NL');
    const meRow = ranked.find((r) => r.id === meId);
    const me = { nickname: meRow.nickname, rank: meRow.rank, scoreText: fmt(meRow.score), correctText: meRow.correct + '/8' };
    const rows = ranked.map((r) => ({
      rank: r.rank,
      nickname: r.id === meId ? r.nickname + ' (jij)' : r.nickname,
      scoreText: fmt(r.score),
      bg: r.id === meId ? accent : 'transparent',
      fg: r.id === meId ? '#111318' : '#F2F0EA'
    }));
    return { accent, me, rows, count: ranked.length };
  }
}
</script>
</body>
</html>
