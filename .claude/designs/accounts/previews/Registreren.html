<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account maken</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Rubik:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFEDD5}
a{color:#C2410C}a:hover{color:#7C2D12}
</style>
</head>
<body>
<div style="min-height: 100vh; box-sizing: border-box; overflow: hidden; position: relative; background: #FFEDD5; color: #7C2D12; font-family: 'Rubik', sans-serif; display: flex; flex-direction: column">
<svg aria-hidden="true" width="1400" height="1400" viewBox="0 0 100 100" style="position: absolute; left: 50%; top: -620px; margin-left: -700px; opacity: 0.18; pointer-events: none">
<circle cx="50" cy="50" r="48" fill="none" stroke="#FB923C" stroke-width="0.3"></circle>
<circle cx="50" cy="50" r="38" fill="none" stroke="#FB923C" stroke-width="0.3"></circle>
<circle cx="50" cy="50" r="28" fill="none" stroke="#FB923C" stroke-width="0.3"></circle>
<circle cx="50" cy="50" r="18" fill="none" stroke="#FB923C" stroke-width="0.3"></circle>
</svg>
<nav aria-label="Hoofdmenu" style="position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; padding: 18px 40px; background: #FFF7ED; border-bottom: 2px solid #FDBA74">
<a href="Main.html" style="font-family: 'Anton', sans-serif; font-size: 30px; letter-spacing: 0.04em; color: #C2410C; text-decoration: none; line-height: 1">OPEN ICT QUIZ</a>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<a href="#" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 2px solid #9A4A22; color: #7C2D12; font-weight: 700; font-size: 16px; text-decoration: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5v16h4"></path><path d="M14 7l-5 5 5 5"></path><path d="M9 12h12"></path></svg>Meedoen met code</a>
</div>
</nav>
<main style="position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; padding: 56px 32px; gap: 28px">
<div style="width: 100%; max-width: 560px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 6px; box-sizing: border-box; border-radius: 999px; background: #FFF7ED; border: 2px solid #FDBA74">
<a href="Main.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 999px; color: #7C2D12; font-weight: 700; font-size: 16px; text-decoration: none">Inloggen</a>
<a href="Registreren.html" aria-current="page" style="display: inline-flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 999px; background: #FDBA74; color: #7C2D12; font-weight: 800; font-size: 16px; text-decoration: none">Account maken</a>
</div>
<form style="width: 100%; max-width: 560px; box-sizing: border-box; background: #FFF7ED; border: 2px solid #FDBA74; border-radius: 24px; padding: 40px; display: flex; flex-direction: column; gap: 16px">
<div>
<p style="margin: 0; font-size: 16px; color: #9A4A22">Bewaar je scores en zie hoe je groeit.</p>
<h1 style="margin: 4px 0 0; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 52px; line-height: 1.05; color: #C2410C; letter-spacing: 0.04em">ACCOUNT MAKEN</h1>
</div>
<label for="nick" style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9A4A22">Gebruikersnaam</label>
<input id="nick" maxlength="20" autocomplete="username" value="Emma" style="box-sizing: border-box; width: 100%; min-height: 58px; margin-top: -8px; padding: 0 18px; border: 2px solid #FDBA74; border-radius: 14px; background: #FFFFFF; color: #7C2D12; font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 20px">
<span style="margin-top: -6px; font-size: 14px; color: #9A4A22">2 tot 20 tekens. Deze naam zie je op het grote scherm.</span>
<label for="mail" style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9A4A22">E-mailadres</label>
<input id="mail" type="email" autocomplete="email" value="emma.jansen@student.hu.nl" style="box-sizing: border-box; width: 100%; min-height: 58px; margin-top: -8px; padding: 0 18px; border: 2px solid #FDBA74; border-radius: 14px; background: #FFFFFF; color: #7C2D12; font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 20px">
<label for="pw" style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9A4A22">Wachtwoord</label>
<input id="pw" type="password" autocomplete="new-password" value="geheim12" style="box-sizing: border-box; width: 100%; min-height: 58px; margin-top: -8px; padding: 0 18px; border: 3px solid #C2410C; border-radius: 14px; background: #FFFFFF; color: #7C2D12; font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 20px">
<div aria-label="Sterkte van het wachtwoord: redelijk" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: -4px">
<span style="height: 8px; border-radius: 999px; background: #C2410C"></span>
<span style="height: 8px; border-radius: 999px; background: #C2410C"></span>
<span style="height: 8px; border-radius: 999px; background: #FDBA74"></span>
<span style="height: 8px; border-radius: 999px; background: #FDBA74"></span>
</div>
<ul style="margin: -4px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: #9A4A22">
<li style="display: flex; align-items: center; gap: 8px; color: #166534; font-weight: 700"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>Minstens 8 tekens</li>
<li style="display: flex; align-items: center; gap: 8px; color: #166534; font-weight: 700"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>Een cijfer</li>
<li style="display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="7"></circle></svg>Een hoofdletter</li>
</ul>
<label style="display: flex; align-items: flex-start; gap: 10px; min-height: 44px; font-size: 16px; line-height: 1.4; font-weight: 500"><input type="checkbox" style="flex: none; width: 22px; height: 22px; accent-color: #C2410C; margin: 0">Ik ga akkoord met de <a href="#" style="font-weight: 700">privacyregels</a>. Mijn scores worden bewaard.</label>
<a href="Account-Student.html" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; box-sizing: border-box; min-height: 58px; padding: 0 32px; width: 100%; border-radius: 999px; background: #FDBA74; color: #7C2D12; font-weight: 800; font-size: 20px; text-decoration: none">Account maken</a>
<p style="margin: 4px 0 0; text-align: center; font-size: 15px; color: #9A4A22">Ben je docent? Een beheerder maakt je account aan.</p>
</form>
</main>
</div>
</body>
</html>
