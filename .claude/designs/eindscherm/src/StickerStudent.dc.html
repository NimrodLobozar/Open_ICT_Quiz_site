<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Jouw plek stickers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFE66D}
a{color:#111111}a:hover{color:#000000}
</style>
</helmet>
<div style="min-height: 100vh; background: {{ground}}; color: #111111; font-family: 'Fredoka', sans-serif; padding: 32px 24px 56px; box-sizing: border-box">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column">
<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px">
<span style="font-weight: 700; font-size: 26px">Open ICT Quiz</span>
<span style="background: #FFFFFF; border: 3px solid #111111; border-radius: 12px; box-shadow: 4px 4px 0 #111111; padding: 8px 16px; font-weight: 600; font-size: 18px">Code 482913</span>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 48px; margin-top: 40px">
<section aria-labelledby="jij" style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<div style="position: relative; background: #FF7AB6; border: 4px solid #111111; border-radius: 28px; box-shadow: 10px 10px 0 #111111; padding: 28px 32px; transform: rotate(-2deg); display: flex; flex-direction: column">
<h1 id="jij" style="margin: 0; font-weight: 700; font-size: 30px">Top gedaan, {{me.nickname}}!</h1>
<span style="font-weight: 700; font-size: 168px; line-height: 0.95">{{me.rank}}e</span>
<span style="font-weight: 600; font-size: 22px">van de {{count}} spelers</span>
<svg width="84" height="84" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; right: 24px; top: -30px; transform: rotate(12deg)"><path d="M12 2l2.9 6.2 6.8.8-5 4.6 1.4 6.7L12 17l-6.1 3.3 1.4-6.7-5-4.6 6.8-.8z" fill="#FFFFFF" stroke="#111111" stroke-width="1.6" stroke-linejoin="round"></path></svg>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
<div style="background: #FFFFFF; border: 3px solid #111111; border-radius: 16px; box-shadow: 4px 4px 0 #111111; padding: 14px; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 500">Punten</span><span style="font-size: 32px; font-weight: 700">{{me.scoreText}}</span></div>
<div style="background: #3DDC97; border: 3px solid #111111; border-radius: 16px; box-shadow: 4px 4px 0 #111111; padding: 14px; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 500">Goed</span><span style="font-size: 32px; font-weight: 700">{{me.correct}}/8</span></div>
<div style="background: #4D9DE0; border: 3px solid #111111; border-radius: 16px; box-shadow: 4px 4px 0 #111111; padding: 14px; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 500">Tot {{gap.rank}}e</span><span style="font-size: 32px; font-weight: 700">{{gap.text}}</span></div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 18px">
<button type="button" style="min-height: 58px; padding: 0 26px; border: 4px solid #111111; border-radius: 16px; background: #3DDC97; color: #111111; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 19px; box-shadow: 5px 5px 0 #111111; cursor: pointer">Account maken en score bewaren</button>
<button type="button" style="min-height: 58px; padding: 0 26px; border: 4px solid #111111; border-radius: 16px; background: #FFFFFF; color: #111111; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 19px; box-shadow: 5px 5px 0 #111111; cursor: pointer">Terug naar start</button>
</div>
<p style="margin: 0; font-size: 16px; font-weight: 500">Als gast wordt je score na de quiz gewist.</p>
</section>

<section aria-labelledby="lijst" style="flex: 1 1 420px; min-width: 0">
<h2 id="lijst" style="margin: 0 0 14px; font-weight: 700; font-size: 30px">Iedereen</h2>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<li style="display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 16px; background: {{r.bg}}; border: 3px solid #111111; border-radius: 14px; box-shadow: 4px 4px 0 #111111; font-size: 19px">
<span style="width: 30px; font-weight: 700">{{r.rank}}</span>
<span style="flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere">{{r.label}}</span>
<span style="font-weight: 600">{{r.scoreText}}</span>
</li>
</sc-for>
</ol>
</section>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ground":{"editor":"color","default":"#FFE66D","options":["#FFE66D","#A8E6FF","#C8F5D2"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const ground = this.props.ground ?? '#FFE66D';
    const results = [
      { id: 1, nickname: 'Sanne', score: 7420, correct: 8 }, { id: 2, nickname: 'Daan', score: 5310, correct: 6 },
      { id: 3, nickname: 'Fatima', score: 6150, correct: 7 }, { id: 4, nickname: 'Lucas', score: 2890, correct: 4 },
      { id: 5, nickname: 'Noah', score: 4480, correct: 5 }, { id: 6, nickname: 'Mo', score: 6150, correct: 7 },
      { id: 7, nickname: 'Emma', score: 3720, correct: 5 }, { id: 8, nickname: 'quizkoning', score: 1540, correct: 2 },
      { id: 9, nickname: 'Yara', score: 5880, correct: 7 }, { id: 10, nickname: 'Tim_04', score: 0, correct: 0 }
    ];
    const meId = 7;
    const fmt = (n) => n.toLocaleString('nl-NL');
    const sorted = results.slice().sort((a, b) => b.score - a.score || a.nickname.localeCompare(b.nickname));
    const ranked = sorted.map((r) => ({ ...r, rank: sorted.findIndex((o) => o.score === r.score) + 1, scoreText: fmt(r.score) }));
    const m = ranked.find((r) => r.id === meId);
    const above = ranked.filter((r) => r.score > m.score).pop();
    const gap = above ? { rank: above.rank, text: fmt(above.score - m.score) } : { rank: 1, text: '—' };
    const rows = ranked.map((r) => ({ ...r, label: r.id === meId ? r.nickname + ' (jij)' : r.nickname, bg: r.id === meId ? '#FF7AB6' : '#FFFFFF' }));
    return { ground, me: m, gap, rows, count: ranked.length };
  }
}
</script>
</body>
</html>
