</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">

<a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 2px solid #9A4A22; color: #7C2D12; font-weight: 700; font-size: 16px; text-decoration: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4"></path><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path></svg>Uitloggen</a>

<div style="flex: 1; width: 100%; max-width: 1360px; margin: 0 auto; box-sizing: border-box; padding: 40px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 32px">
<nav aria-label="Beheermenu" style="flex: 1 1 220px; max-width: 260px; min-width: 0; background: #FFF7ED; border: 2px solid #FDBA74; border-radius: 24px; padding: 12px; box-sizing: border-box">
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px">
<li><a href="Admin-Overzicht.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border-radius: 999px; color: #7C2D12; font-weight: 700; font-size: 17px; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>Overzicht</a></li>
<li><a href="Admin-Overzicht.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border-radius: 999px; color: #7C2D12; font-weight: 700; font-size: 17px; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17v.5"></path></svg>Quizzen</a></li>
<li><a href="Admin-Gebruikers.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border-radius: 999px; background: {{accent}}; color: #7C2D12; font-weight: 800; font-size: 17px; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 14.5c2.5.5 4 2.3 4 5.5"></path></svg>Gebruikers</a></li>
<li><a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border-radius: 999px; color: #7C2D12; font-weight: 700; font-size: 17px; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"></path></svg>Uitslagen</a></li>
<li><a href="Admin-Account.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border-radius: 999px; color: #7C2D12; font-weight: 700; font-size: 17px; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>Mijn account</a></li>
</ul>
</nav>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9A4A22">248 accounts</span>
<h1 style="margin: 0; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 60px; line-height: 1.05; color: #C2410C; letter-spacing: 0.04em">GEBRUIKERS</h1>
</div>
<a href="#" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 0 28px; border-radius: 999px; background: {{accent}}; color: #7C2D12; font-weight: 800; font-size: 19px; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Docent toevoegen</a>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div role="group" aria-label="Filter op rol" style="display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; border-radius: 999px; background: #FFF7ED; border: 2px solid #FDBA74">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: {{f.bg}}; color: #7C2D12; font-family: 'Rubik', sans-serif; font-weight: {{f.weight}}; font-size: 16px; cursor: pointer">{{f.label}}</button>
</sc-for>
</div>
<label style="position: relative; display: block; flex: 0 1 320px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Zoek op naam of e-mail</span><input type="search" placeholder="Zoek op naam of e-mail" style="box-sizing: border-box; width: 100%; min-height: 52px; padding: 0 16px 0 44px; border: 2px solid #FDBA74; border-radius: 999px; background: #FFFFFF; color: #7C2D12; font-family: 'Rubik', sans-serif; font-size: 16px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A4A22" stroke-width="2.4" stroke-linecap="round" style="position: absolute; left: 16px; top: 17px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></label>
</div>
<div style="background: #FFF7ED; border: 2px solid #FDBA74; border-radius: 24px; overflow-x: auto">
<table style="width: 100%; min-width: 760px; border-collapse: collapse; font-size: 16px">
<thead>
<tr style="text-align: left; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #9A4A22">
<th scope="col" style="padding: 18px 24px; font-weight: 700">Naam</th>
<th scope="col" style="padding: 18px 12px; font-weight: 700">Rol</th>
<th scope="col" style="padding: 18px 12px; font-weight: 700; text-align: right">Gespeeld</th>
<th scope="col" style="padding: 18px 12px; font-weight: 700">Laatst actief</th>
<th scope="col" style="padding: 18px 24px; font-weight: 700; text-align: right">Acties</th>
</tr>
</thead>
<tbody>
<sc-for list="{{users}}" as="u" hint-placeholder-count="8">
<tr style="border-top: 2px solid #FDBA74">
<td style="padding: 12px 24px"><span style="display: flex; align-items: center; gap: 12px"><span aria-hidden="true" style="flex: none; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 999px; background: #FFEDD5; border: 2px solid #FDBA74; font-weight: 800; font-size: 14px">{{u.initials}}</span><span style="display: flex; flex-direction: column; min-width: 0"><strong>{{u.name}}</strong><span style="font-size: 14px; color: #9A4A22">{{u.email}}</span></span></span></td>
<td style="padding: 12px"><span style="display: inline-flex; align-items: center; min-height: 30px; padding: 0 12px; border-radius: 999px; font-weight: 800; font-size: 14px; background: {{u.pillBg}}; color: {{u.pillFg}}; border: 2px solid {{u.pillBorder}}">{{u.role}}</span></td>
<td style="padding: 12px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums">{{u.played}}</td>
<td style="padding: 12px; color: #9A4A22">{{u.last}}</td>
<td style="padding: 12px 24px"><span style="display: flex; justify-content: flex-end; gap: 8px">
<button type="button" aria-label="{{u.editLabel}}" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 999px; border: 2px solid #9A4A22; background: transparent; color: #7C2D12; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13 7l4 4"></path></svg></button>
<button type="button" aria-label="{{u.delLabel}}" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 999px; border: 2px solid #B91C1C; background: #FFFFFF; color: #991B1B; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
</span></td>
</tr>
</sc-for>
</tbody>
</table>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; color: #9A4A22">
<span>{{countText}}</span>
<span style="display: flex; gap: 8px">
<a href="#" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 2px solid #9A4A22; color: #7C2D12; font-weight: 700; text-decoration: none">Vorige</a>
<a href="#" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 2px solid #9A4A22; color: #7C2D12; font-weight: 700; text-decoration: none">Volgende</a>
</span>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FDBA74","options":["#FDBA74","#C2410C"]},"$preview":{"width":1440,"height":1150}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'Alle' }; }
  renderVals() {
    const accent = this.props.accent ?? '#FDBA74';
    const pills = {
      Beheerder: { pillBg: '#C2410C', pillFg: '#FFFFFF', pillBorder: '#C2410C' },
      Docent: { pillBg: accent, pillFg: '#7C2D12', pillBorder: accent },
      Student: { pillBg: '#FFEDD5', pillFg: '#7C2D12', pillBorder: '#FDBA74' }
    };
    const all = [
      ['Jan de Vries', 'j.devries@hu.nl', 'Beheerder', '—', 'nu online'],
      ['Sara Bakker', 's.bakker@hu.nl', 'Docent', '—', 'gisteren'],
      ['Emma Jansen', 'emma.jansen@student.hu.nl', 'Student', '14', '24 okt'],
      ['Daan Visser', 'daan.visser@student.hu.nl', 'Student', '12', '24 okt'],
      ['Fatima el Amrani', 'fatima.elamrani@student.hu.nl', 'Student', '15', '24 okt'],
      ['Lucas Smit', 'lucas.smit@student.hu.nl', 'Student', '9', '17 okt'],
      ['Mo Haddou', 'mo.haddou@student.hu.nl', 'Student', '11', '17 okt'],
      ['Pieter Mulder', 'p.mulder@hu.nl', 'Docent', '—', '3 okt']
    ].map(([name, email, role, played, last]) => ({
      name, email, role, played, last, ...pills[role],
      initials: name.split(' ').map((w) => w[0]).filter((c) => c === c.toUpperCase()).slice(0, 2).join(''),
      editLabel: 'Bewerk ' + name, delLabel: 'Verwijder ' + name
    }));
    const map = { Alle: null, Studenten: 'Student', Docenten: 'Docent', Beheerders: 'Beheerder' };
    const f = this.state.filter;
    const users = map[f] ? all.filter((u) => u.role === map[f]) : all;
    const filters = Object.keys(map).map((label) => ({
      label, pressed: String(label === f),
      bg: label === f ? accent : 'transparent', weight: label === f ? 800 : 700,
      pick: () => this.setState({ filter: label })
    }));
    return { accent, filters, users, countText: users.length + ' van 248 getoond' };
  }
}
</script>
</body>
</html>
