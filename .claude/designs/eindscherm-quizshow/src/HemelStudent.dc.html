<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Jouw plek quizshow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Rubik:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#DCEBFA}
a{color:#2F5C93}a:hover{color:#1F3A5C}
</style>
</helmet>
<div style="min-height: 100vh; background: #DCEBFA; color: #1F3A5C; font-family: 'Rubik', sans-serif; padding: 32px 24px 56px; box-sizing: border-box">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column">
<header style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-weight: 700; font-size: 18px; color: #4A6890; letter-spacing: 0.06em; text-transform: uppercase">
<span>Open ICT Quiz</span>
<span>Code 482913</span>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 56px; margin-top: 40px">
<section aria-labelledby="jij" style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center">
<h1 id="jij" style="margin: 0; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 48px; color: #2F5C93; letter-spacing: 0.04em">{{me.upper}}, JIJ BENT</h1>
<div style="width: 100%; background: {{accent}}; padding: 4px; clip-path: polygon(48px 0, calc(100% - 48px) 0, 100% 50%, calc(100% - 48px) 100%, 48px 100%, 0 50%)">
<div style="background: {{accent}}; color: #1F3A5C; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span style="font-family: 'Anton', sans-serif; font-size: 140px; line-height: 1">{{me.rank}}E</span>
<span style="font-weight: 800; font-size: 20px">VAN {{count}} SPELERS</span>
</div>
</div>
<div style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<div style="background: #F4F9FF; border: 2px solid #AFCBEC; border-radius: 12px; padding: 14px; display: flex; flex-direction: column"><span style="font-size: 14px; color: #4A6890">Punten</span><span style="font-family: 'Anton', sans-serif; font-size: 34px">{{me.scoreText}}</span></div>
<div style="background: #F4F9FF; border: 2px solid #AFCBEC; border-radius: 12px; padding: 14px; display: flex; flex-direction: column"><span style="font-size: 14px; color: #4A6890">Goed</span><span style="font-family: 'Anton', sans-serif; font-size: 34px">{{me.correct}}/8</span></div>
<div style="background: #F4F9FF; border: 2px solid #AFCBEC; border-radius: 12px; padding: 14px; display: flex; flex-direction: column"><span style="font-size: 14px; color: #4A6890">Tot {{gap.rank}}e</span><span style="font-family: 'Anton', sans-serif; font-size: 34px">{{gap.text}}</span></div>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px">
<button type="button" style="min-height: 56px; padding: 0 28px; border: 0; border-radius: 999px; background: {{accent}}; color: #1F3A5C; font-family: 'Rubik', sans-serif; font-weight: 800; font-size: 18px; cursor: pointer">Account maken en score bewaren</button>
<button type="button" style="min-height: 56px; padding: 0 28px; border: 2px solid #4A6890; border-radius: 999px; background: transparent; color: #1F3A5C; font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 18px; cursor: pointer">Terug naar start</button>
</div>
<p style="margin: 0; font-size: 15px; color: #4A6890">Als gast wordt je score na de quiz gewist.</p>
</section>

<section aria-labelledby="lijst" style="flex: 1 1 420px; min-width: 0">
<h2 id="lijst" style="margin: 0 0 14px; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 32px; color: #2F5C93; letter-spacing: 0.04em">EINDSTAND</h2>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<li style="background: {{r.edge}}; padding: 2px; clip-path: polygon(20px 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 20px 100%, 0 50%)">
<div style="background: {{r.fill}}; color: {{r.fg}}; min-height: 50px; display: flex; align-items: center; gap: 16px; padding: 0 36px; font-size: 19px; clip-path: polygon(19px 0, calc(100% - 19px) 0, 100% 50%, calc(100% - 19px) 100%, 19px 100%, 0 50%)">
<span style="font-family: 'Anton', sans-serif; width: 26px">{{r.rank}}</span>
<span style="flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere">{{r.label}}</span>
<span style="font-weight: 500">{{r.scoreText}}</span>
</div>
</li>
</sc-for>
</ol>
</section>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F4B393","options":["#F4B393","#2F5C93"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#F4B393';
    const results = [
      { id: 1, nickname: 'Sanne', score: 7420, correct: 8 }, { id: 2, nickname: 'Daan', score: 5310, correct: 6 },
      { id: 3, nickname: 'Fatima', score: 6150, correct: 7 }, { id: 4, nickname: 'Lucas', score: 2890, correct: 4 },
      { id: 5, nickname: 'Noah', score: 4480, correct: 5 }, { id: 6, nickname: 'Mo', score: 6150, correct: 7 },
      { id: 7, nickname: 'Emma', score: 3720, correct: 5 }, { id: 8, nickname: 'quizkoning', score: 1540, correct: 2 },
      { id: 9, nickname: 'Yara', score: 5880, correct: 7 }, { id: 10, nickname: 'Tim_04', score: 0, correct: 0 }
    ];
    const meId = 7;
    const fmt = (n) => n.toLocaleString('nl-NL');
    const sorted = results.slice().sort((a, b) => b.score - a.score || a.nickname.localeCompare(b.nickname));
    const ranked = sorted.map((r) => ({ ...r, rank: sorted.findIndex((o) => o.score === r.score) + 1, scoreText: fmt(r.score) }));
    const m = ranked.find((r) => r.id === meId);
    const above = ranked.filter((r) => r.score > m.score).pop();
    const gap = above ? { rank: above.rank, text: fmt(above.score - m.score) } : { rank: 1, text: '—' };
    const rows = ranked.map((r) => {
      const mine = r.id === meId;
      return { ...r, label: mine ? r.nickname + ' (jij)' : r.nickname, edge: mine ? accent : '#AFCBEC', fill: mine ? accent : '#F4F9FF', fg: mine ? '#1F3A5C' : '#1F3A5C' };
    });
    return { accent, me: { ...m, upper: m.nickname.toUpperCase() }, gap, rows, count: ranked.length };
  }
}
</script>
</body>
</html>
