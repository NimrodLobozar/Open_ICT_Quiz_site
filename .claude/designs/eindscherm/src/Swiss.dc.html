<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Uitslag poster</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#111111}a:hover{color:#E2231A}
</style>
</helmet>
<div style="min-height: 100vh; background: #FFFFFF; color: #111111; font-family: 'Archivo', sans-serif; padding: 40px 24px 64px; box-sizing: border-box">
<div style="max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column">

<header style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; padding-bottom: 12px; border-bottom: 3px solid #111111; font-size: 15px; font-weight: 500">
<span style="font-weight: 900">Open ICT Quiz</span>
<span>Uitslag</span>
<span>8 vragen · 10 spelers</span>
<span style="text-align: right">Code 482913</span>
</header>

<section aria-label="Winnaars" style="display: flex; flex-wrap: wrap; gap: 40px; padding: 40px 0 48px; border-bottom: 3px solid #111111">
<div style="flex: 3 1 560px; min-width: 0; display: flex; flex-direction: column">
<span style="font-weight: 900; font-size: 320px; line-height: 0.75; color: {{accent}}; letter-spacing: -0.04em">1</span>
<h1 style="margin: 32px 0 0; font-weight: 900; font-size: clamp(72px, 10vw, 152px); line-height: 0.85; letter-spacing: -0.03em">{{first.nickname}}</h1>
<p style="margin: 16px 0 0; font-size: 24px; font-weight: 500">{{first.scoreText}} punten · {{first.correct}} van 8 goed</p>
</div>
<ol style="flex: 2 1 360px; min-width: 0; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 0">
<sc-for list="{{runners}}" as="p" hint-placeholder-count="2">
<li style="display: flex; align-items: baseline; gap: 20px; padding: 20px 0; border-top: 1px solid #111111">
<span style="font-weight: 900; font-size: 96px; line-height: 0.8; width: 72px">{{p.rank}}</span>
<span style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<span style="font-weight: 900; font-size: 48px; line-height: 0.9; letter-spacing: -0.02em; overflow-wrap: anywhere">{{p.nickname}}</span>
<span style="font-size: 18px; font-weight: 500">{{p.scoreText}} punten{{p.tieText}}</span>
</span>
</li>
</sc-for>
</ol>
</section>

<section aria-labelledby="rest-titel" style="padding-top: 24px">
<h2 id="rest-titel" style="margin: 0 0 12px; font-size: 15px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em">Verder</h2>
<ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px">
<sc-for list="{{rest}}" as="r" hint-placeholder-count="7">
<li style="display: flex; align-items: baseline; gap: 16px; padding: 14px 0; border-bottom: 1px solid #111111; font-size: 22px">
<span style="width: 36px; font-weight: 900">{{r.rank}}</span>
<span style="flex: 1; min-width: 0; font-weight: 500; overflow-wrap: anywhere">{{r.nickname}}</span>
<span style="font-variant-numeric: tabular-nums">{{r.scoreText}}</span>
</li>
</sc-for>
</ol>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 12px; padding-top: 48px">
<button type="button" style="min-height: 56px; padding: 0 28px; border: 0; background: #111111; color: #FFFFFF; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 18px; cursor: pointer">Nog een ronde</button>
<button type="button" style="min-height: 56px; padding: 0 28px; border: 3px solid #111111; background: #FFFFFF; color: #111111; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 18px; cursor: pointer">Terug naar start</button>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E2231A","options":["#E2231A","#1F4BFF","#111111"]},"$preview":{"width":1440,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#E2231A';
    const results = [
      { nickname: 'Sanne', score: 7420, correct: 8 },
      { nickname: 'Daan', score: 5310, correct: 6 },
      { nickname: 'Fatima', score: 6150, correct: 7 },
      { nickname: 'Lucas', score: 2890, correct: 4 },
      { nickname: 'Noah', score: 4480, correct: 5 },
      { nickname: 'Mo', score: 6150, correct: 7 },
      { nickname: 'Emma', score: 3720, correct: 5 },
      { nickname: 'quizkoning', score: 1540, correct: 2 },
      { nickname: 'Yara', score: 5880, correct: 7 },
      { nickname: 'Tim_04', score: 0, correct: 0 }
    ];
    const sorted = results.slice().sort((a, b) => b.score - a.score || a.nickname.localeCompare(b.nickname));
    const fmt = (n) => n.toLocaleString('nl-NL');
    const ranked = sorted.map((r) => ({ ...r, rank: sorted.findIndex((o) => o.score === r.score) + 1, scoreText: fmt(r.score) }));
    const tied = (rank) => ranked.filter((r) => r.rank === rank).length > 1;
    const runners = ranked.slice(1, 3).map((r) => ({ ...r, tieText: tied(r.rank) ? ' · gedeeld' : '' }));
    return { accent, first: ranked[0], runners, rest: ranked.slice(3) };
  }
}
</script>
</body>
</html>
