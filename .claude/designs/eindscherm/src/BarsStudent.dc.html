<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Jouw resultaat staafdiagram</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F1F2F4}
a{color:#0F5F59}a:hover{color:#14161A}
</style>
</helmet>
<div style="min-height: 100vh; background: #F1F2F4; color: #14161A; font-family: 'Space Grotesk', sans-serif; padding: 40px 24px 56px; box-sizing: border-box">
<div style="max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column">

<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; font-size: 16px; color: #545B66">
<span style="font-weight: 700; color: #14161A">Open ICT Quiz</span>
<span style="font-family: 'IBM Plex Mono', monospace">sessie 482913</span>
</header>

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px; margin-top: 40px">
<div style="display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 18px; color: #545B66">Jouw resultaat, {{me.nickname}}</p>
<h1 style="margin: 0; font-weight: 700; font-size: clamp(48px, 6vw, 84px); line-height: 0.95; letter-spacing: -0.02em">{{me.rank}}e van {{count}}</h1>
<p style="margin: 0; font-size: 20px; color: #3A404A">{{gapText}}</p>
</div>
<div style="display: flex; gap: 32px">
<div style="display: flex; flex-direction: column"><span style="font-size: 14px; color: #545B66; text-transform: uppercase; letter-spacing: 0.08em">Punten</span><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 32px">{{me.scoreText}}</span></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 14px; color: #545B66; text-transform: uppercase; letter-spacing: 0.08em">Goed</span><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 32px">{{me.correct}}/8</span></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 14px; color: #545B66; text-transform: uppercase; letter-spacing: 0.08em">Klas gem.</span><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 32px">{{avgText}}</span></div>
</div>
</div>

<ol style="list-style: none; margin: 40px 0 0; padding: 28px; background: #FFFFFF; border-radius: 12px; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<li style="display: grid; grid-template-columns: 44px minmax(96px, 180px) minmax(0, 1fr) 96px; align-items: center; gap: 16px">
<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 18px; color: {{r.rankColor}}">{{r.rank}}</span>
<span style="font-weight: {{r.weight}}; font-size: 19px; overflow-wrap: anywhere">{{r.label}}</span>
<span style="height: {{r.barH}}; background: #E6E8EC; border-radius: 4px; overflow: hidden; display: block">
<span style="display: block; height: 100%; width: {{r.pct}}; background: {{r.barColor}}; border-radius: 4px"></span>
</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; text-align: right; font-weight: {{r.weight}}">{{r.scoreText}}</span>
</li>
</sc-for>
</ol>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 32px">
<button type="button" style="min-height: 52px; padding: 0 28px; border: 0; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; cursor: pointer">Account maken en score bewaren</button>
<button type="button" style="min-height: 52px; padding: 0 28px; border: 2px solid #14161A; border-radius: 8px; background: transparent; color: #14161A; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; cursor: pointer">Terug naar start</button>
<span style="font-size: 15px; color: #545B66">Als gast wordt je score na de quiz gewist.</span>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0F5F59","options":["#0F5F59","#2B4ACB","#B4451F"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#0F5F59';
    const results = [
      { id: 1, nickname: 'Sanne', score: 7420, correct: 8 },
      { id: 2, nickname: 'Daan', score: 5310, correct: 6 },
      { id: 3, nickname: 'Fatima', score: 6150, correct: 7 },
      { id: 4, nickname: 'Lucas', score: 2890, correct: 4 },
      { id: 5, nickname: 'Noah', score: 4480, correct: 5 },
      { id: 6, nickname: 'Mo', score: 6150, correct: 7 },
      { id: 7, nickname: 'Emma', score: 3720, correct: 5 },
      { id: 8, nickname: 'quizkoning', score: 1540, correct: 2 },
      { id: 9, nickname: 'Yara', score: 5880, correct: 7 },
      { id: 10, nickname: 'Tim_04', score: 0, correct: 0 }
    ];
    const meId = 7;
    const fmt = (n) => n.toLocaleString('nl-NL');
    const sorted = results.slice().sort((a, b) => b.score - a.score || a.nickname.localeCompare(b.nickname));
    const ranked = sorted.map((r) => ({ ...r, rank: sorted.findIndex((o) => o.score === r.score) + 1, scoreText: fmt(r.score) }));
    const me = ranked.find((r) => r.id === meId);
    const above = ranked.filter((r) => r.score > me.score).pop();
    const gapText = above ? 'Nog ' + fmt(above.score - me.score) + ' punten en je was ' + above.rank + 'e geweest.' : 'Niemand had meer punten.';
    const max = ranked[0].score || 1;
    const avg = Math.round(ranked.reduce((s, r) => s + r.score, 0) / ranked.length);
    const rows = ranked.map((r) => {
      const mine = r.id === meId;
      return {
        ...r,
        label: mine ? r.nickname + ' (jij)' : r.nickname,
        pct: Math.round((r.score / max) * 100) + '%',
        barColor: mine ? accent : '#9AA2AE',
        barH: mine ? '32px' : '20px',
        weight: mine ? 700 : 500,
        rankColor: mine ? accent : '#545B66'
      };
    });
    return { accent, me, gapText, rows, count: ranked.length, avgText: fmt(avg) };
  }
}
</script>
</body>
</html>
