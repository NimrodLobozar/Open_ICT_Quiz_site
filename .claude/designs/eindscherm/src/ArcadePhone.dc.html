<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Jouw score arcade telefoon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0F}
a{color:#3EF2E0}a:hover{color:#FFE14D}
</style>
</helmet>
<div style="width: 390px; height: 1240px; box-sizing: border-box; background: #0B0B0F; color: #F4F4F4; font-family: 'VT323', monospace; padding: 24px 16px 32px; display: flex; flex-direction: column">

<div style="display: flex; justify-content: space-between; font-size: 22px; color: #9A9AA8">
<span>OPEN ICT QUIZ</span>
<span>482913</span>
</div>

<h1 style="margin: 28px 0 0; font-family: 'Press Start 2P', monospace; font-size: 28px; line-height: 1.3; color: {{accent}}; text-shadow: 4px 4px 0 #5B1E7A">GAME OVER</h1>
<p style="margin: 12px 0 0; font-size: 26px">SPELER: {{me.name}}</p>

<div style="margin-top: 20px; border: 5px solid {{accent}}; padding: 16px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
<span style="font-family: 'Press Start 2P', monospace; font-size: 64px; line-height: 1; color: {{accent}}">{{me.rank}}E</span>
<span style="font-size: 24px; text-align: right">VAN {{count}}<br>SPELERS</span>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 16px; font-size: 26px">
<div style="display: flex; flex-direction: column"><span style="color: #9A9AA8; font-size: 18px">SCORE</span><span>{{me.scorePad}}</span></div>
<div style="display: flex; flex-direction: column"><span style="color: #9A9AA8; font-size: 18px">GOED</span><span>{{me.correct}}/8</span></div>
<div style="display: flex; flex-direction: column"><span style="color: #9A9AA8; font-size: 18px">NAAR {{gap.rank}}E</span><span style="color: #3EF2E0">+{{gap.pts}}</span></div>
</div>

<h2 style="margin: 28px 0 8px; font-family: 'Press Start 2P', monospace; font-size: 14px; color: #3EF2E0">HIGH SCORES</h2>
<ol style="list-style: none; margin: 0; padding: 0; font-size: 28px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<li style="display: flex; gap: 10px; padding: 2px 6px; color: {{r.color}}; background: {{r.bg}}">
<span style="width: 40px">{{r.rank}}E</span>
<span style="flex: 1; min-width: 0; overflow-wrap: anywhere">{{r.name}}</span>
<span>{{r.scorePad}}</span>
</li>
</sc-for>
</ol>

<div style="display: flex; flex-direction: column; gap: 14px; margin-top: auto; padding-top: 24px">
<p style="margin: 0; font-size: 20px; color: #9A9AA8">GAST: SCORE WORDT NA DE QUIZ GEWIST</p>
<button type="button" style="min-height: 56px; border: 0; background: {{accent}}; color: #0B0B0F; font-family: 'Press Start 2P', monospace; font-size: 13px; box-shadow: 5px 5px 0 #5B1E7A">SCORE BEWAREN</button>
<button type="button" style="min-height: 56px; border: 4px solid #F4F4F4; background: transparent; color: #F4F4F4; font-family: 'Press Start 2P', monospace; font-size: 13px">STOPPEN</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFE14D","options":["#FFE14D","#3EF2E0","#FF4FD8"]},"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FFE14D';
    const results = [
      { id: 1, nickname: 'Sanne', score: 7420, correct: 8 },
      { id: 2, nickname: 'Daan', score: 5310, correct: 6 },
      { id: 3, nickname: 'Fatima', score: 6150, correct: 7 },
      { id: 4, nickname: 'Lucas', score: 2890, correct: 4 },
      { id: 5, nickname: 'Noah', score: 4480, correct: 5 },
      { id: 6, nickname: 'Mo', score: 6150, correct: 7 },
      { id: 7, nickname: 'Emma', score: 3720, correct: 5 },
      { id: 8, nickname: 'quizkoning', score: 1540, correct: 2 },
      { id: 9, nickname: 'Yara', score: 5880, correct: 7 },
      { id: 10, nickname: 'Tim_04', score: 0, correct: 0 }
    ];
    const meId = 7;
    const pad = (n) => String(n).padStart(6, '0');
    const sorted = results.slice().sort((a, b) => b.score - a.score || a.nickname.localeCompare(b.nickname));
    const ranked = sorted.map((r) => ({ ...r, rank: sorted.findIndex((o) => o.score === r.score) + 1, name: r.nickname.toUpperCase(), scorePad: pad(r.score) }));
    const me = ranked.find((r) => r.id === meId);
    const above = ranked.filter((r) => r.score > me.score).pop();
    const gap = above ? { rank: above.rank, pts: above.score - me.score } : { rank: 1, pts: 0 };
    const colors = { 1: '#FFE14D', 2: '#3EF2E0', 3: '#FF4FD8' };
    const rows = ranked.map((r) => ({
      ...r,
      name: r.id === meId ? r.name + ' <' : r.name,
      color: r.id === meId ? '#0B0B0F' : (colors[r.rank] || '#F4F4F4'),
      bg: r.id === meId ? accent : 'transparent'
    }));
    return { accent, me, gap, rows, count: ranked.length };
  }
}
</script>
</body>
</html>
