services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:3000
      # Windows/OneDrive geeft bestandswijzigingen niet door aan Docker,
      # dus Vite moet zelf regelmatig kijken (polling) voor live reload.
      VITE_USE_POLLING: "true"
    volumes:
      # Moet gelijk zijn aan WORKDIR in de Dockerfile, anders draait Vite
      # op de kopie uit de image en zie je je wijzigingen niet.
      - .:/home/node/app
      - /home/node/app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://quiz:quiz@db:5432/quiz
      NODE_ENV: development
      # Adres van de website, voor links in mails (wachtwoord vergeten, docent-uitnodiging).
      APP_URL: http://localhost:5173
      # Eerste beheerder, alleen voor development. Wijzig dit wachtwoord op een echte server!
      SEED_ADMIN_EMAIL: beheerder@quiz.local
      SEED_ADMIN_PASSWORD: Beheerder123
      SEED_ADMIN_NAME: Beheerder
    volumes:
      # Je backend-code live in de container, zodat nodemon wijzigingen ziet
      # zonder rebuild. node_modules blijft die uit de image.
      - ./backend:/app/backend
      - ./src/utils:/app/src/utils
      - ./prisma:/app/prisma
      - ./prisma.config.ts:/app/prisma.config.ts
      - ./nodemon.json:/app/nodemon.json
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz
      POSTGRES_DB: quiz
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz -d quiz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # De database bekijken in de browser: http://localhost:8080
  # Inloggen met systeem PostgreSQL, server `db`, gebruiker/wachtwoord/database `quiz`.
  # Server is `db` en niet localhost: Adminer draait zelf in Docker en praat via het Docker-netwerk.
  adminer:
    image: adminer:5
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  postgres-data:
