<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Jouw plek quizfeest telefoon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#46178F}
a{color:#FFFFFF}a:hover{color:#FFC00A}
</style>
</helmet>
<div style="width: 390px; height: 1240px; box-sizing: border-box; background: {{ground}}; color: #FFFFFF; font-family: 'Montserrat', sans-serif; display: flex; flex-direction: column">

<header style="background: #FFFFFF; color: #2F0F66; display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; font-weight: 800; font-size: 15px">
<span>Open ICT Quiz</span>
<span>PIN 482913</span>
</header>

<div style="flex: 1; padding: 28px 16px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px">
<h1 style="margin: 0; font-weight: 900; font-size: 24px">Klaar! Je eindigt op</h1>
<div style="background: #FFFFFF; color: #2F0F66; border-radius: 14px; box-shadow: 0 7px 0 #2F0F66; padding: 14px 40px; display: flex; flex-direction: column; align-items: center">
<span style="font-weight: 900; font-size: 104px; line-height: 1">{{me.rank}}e</span>
<span style="font-weight: 800; font-size: 18px">plaats van {{count}}</span>
</div>
<p style="margin: 4px 0 0; font-weight: 700; font-size: 18px">{{gapText}}</p>

<div style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="background: #26890C; border-radius: 10px; box-shadow: 0 4px 0 #145206; padding: 10px 6px; display: flex; flex-direction: column; align-items: center">
<span style="font-weight: 900; font-size: 26px">{{me.correct}}</span><span style="font-weight: 700; font-size: 14px">goed</span>
</div>
<div style="background: #E21B3C; border-radius: 10px; box-shadow: 0 4px 0 #8C0F24; padding: 10px 6px; display: flex; flex-direction: column; align-items: center">
<span style="font-weight: 900; font-size: 26px">{{me.wrong}}</span><span style="font-weight: 700; font-size: 14px">fout</span>
</div>
<div style="background: #1368CE; border-radius: 10px; box-shadow: 0 4px 0 #0A3E7D; padding: 10px 6px; display: flex; flex-direction: column; align-items: center">
<span style="font-weight: 900; font-size: 26px">{{me.scoreText}}</span><span style="font-weight: 700; font-size: 14px">punten</span>
</div>
</div>

<section aria-labelledby="lijst" style="width: 100%; display: flex; flex-direction: column; gap: 7px; text-align: left; margin-top: 6px">
<h2 id="lijst" style="margin: 0 0 4px; font-weight: 900; font-size: 20px">Scorebord</h2>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<div style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; background: {{r.bg}}; color: #2F0F66; border-radius: 8px; box-shadow: 0 3px 0 #2F0F66; font-size: 16px">
<span style="width: 28px; height: 28px; border-radius: 6px; background: #46178F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px">{{r.rank}}</span>
<span style="flex: 1; min-width: 0; font-weight: 800; overflow-wrap: anywhere">{{r.label}}</span>
<span style="font-weight: 800">{{r.scoreText}}</span>
</div>
</sc-for>
</section>

<div style="width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: auto">
<button type="button" style="min-height: 54px; border: 0; border-radius: 10px; background: #FFC00A; color: #2F0F66; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 16px; box-shadow: 0 5px 0 #A87500">Account maken en score bewaren</button>
<button type="button" style="min-height: 54px; border: 0; border-radius: 10px; background: #FFFFFF; color: #2F0F66; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 16px; box-shadow: 0 5px 0 #2F0F66">Terug naar start</button>
</div>
</div>

<footer style="background: #2F0F66; display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; font-weight: 900; font-size: 17px">
<span>{{me.nickname}}</span>
<span style="background: #FFFFFF; color: #2F0F66; padding: 4px 12px; border-radius: 6px">{{me.scoreText}}</span>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ground":{"editor":"color","default":"#46178F","options":["#46178F","#1368CE","#2F0F66"]},"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const ground = this.props.ground ?? '#46178F';
    const results = [
      { id: 1, nickname: 'Sanne', score: 7420, correct: 8 },
      { id: 2, nickname: 'Daan', score: 5310, correct: 6 },
      { id: 3, nickname: 'Fatima', score: 6150, correct: 7 },
      { id: 4, nickname: 'Lucas', score: 2890, correct: 4 },
      { id: 5, nickname: 'Noah', score: 4480, correct: 5 },
      { id: 6, nickname: 'Mo', score: 6150, correct: 7 },
      { id: 7, nickname: 'Emma', score: 3720, correct: 5 },
      { id: 8, nickname: 'quizkoning', score: 1540, correct: 2 },
      { id: 9, nickname: 'Yara', score: 5880, correct: 7 },
      { id: 10, nickname: 'Tim_04', score: 0, correct: 0 }
    ];
    const meId = 7;
    const fmt = (n) => n.toLocaleString('nl-NL');
    const sorted = results.slice().sort((a, b) => b.score - a.score || a.nickname.localeCompare(b.nickname));
    const ranked = sorted.map((r) => ({ ...r, rank: sorted.findIndex((o) => o.score === r.score) + 1, scoreText: fmt(r.score) }));
    const m = ranked.find((r) => r.id === meId);
    const above = ranked.filter((r) => r.score > m.score).pop();
    const gapText = above ? fmt(above.score - m.score) + ' punten achter ' + above.nickname : 'Niemand had meer punten!';
    const rows = ranked.map((r) => ({
      ...r,
      label: r.id === meId ? r.nickname + ' (jij)' : r.nickname,
      bg: r.id === meId ? '#FFC00A' : '#FFFFFF'
    }));
    return { ground, me: { ...m, wrong: 8 - m.correct }, gapText, rows, count: ranked.length };
  }
}
</script>
</body>
</html>
