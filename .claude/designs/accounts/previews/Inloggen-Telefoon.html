<a href="Registreren.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 999px; color: #7C2D12; font-weight: 700; font-size: 16px; text-decoration: none">Account maken</a>

<form style="background: #FFF7ED; border: 2px solid #FDBA74; border-radius: 24px; padding: 24px 20px; display: flex; flex-direction: column; gap: 14px">
<div>

</div>
<label for="m-mail" style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9A4A22">E-mailadres</label>
<input id="m-mail" type="email" autocomplete="email" value="emma.jansen@student.hu.nl" style="box-sizing: border-box; width: 100%; min-height: 54px; margin-top: -6px; padding: 0 14px; border: 3px solid #C2410C; border-radius: 14px; background: #FFFFFF; color: #7C2D12; font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 17px">
<label for="m-pw" style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9A4A22">Wachtwoord</label>
<input id="m-pw" type="password" autocomplete="current-password" value="geheim123" style="box-sizing: border-box; width: 100%; min-height: 54px; margin-top: -6px; padding: 0 14px; border: 2px solid #FDBA74; border-radius: 14px; background: #FFFFFF; color: #7C2D12; font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 17px">
<a href="#" style="align-self: flex-end; display: inline-flex; align-items: center; min-height: 44px; margin: -6px 0; font-size: 15px; font-weight: 700">Wachtwoord vergeten?</a>
<a href="Account-Telefoon.html" style="display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; min-height: 56px; width: 100%; border-radius: 999px; background: #FDBA74; color: #7C2D12; font-weight: 800; font-size: 19px; text-decoration: none">Inloggen</a>
</form>
<p style="margin: 0; text-align: center; font-size: 15px; line-height: 1.5; color: #9A4A22">Alleen meedoen? Daar heb je geen account voor nodig.</p>
