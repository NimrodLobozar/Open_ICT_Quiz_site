<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accountinstellingen</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Rubik:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFEDD5}
a{color:#C2410C}a:hover{color:#7C2D12}
</style>
</head>
<body>
<div style="min-height: 100vh; box-sizing: border-box; overflow: hidden; position: relative; background: #FFEDD5; color: #7C2D12; font-family: 'Rubik', sans-serif; display: flex; flex-direction: column">
<nav aria-label="Hoofdmenu" style="position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; padding: 18px 40px; background: #FFF7ED; border-bottom: 2px solid #FDBA74">
<a href="Main.html" style="font-family: 'Anton', sans-serif; font-size: 30px; letter-spacing: 0.04em; color: #C2410C; text-decoration: none; line-height: 1">OPEN ICT QUIZ</a>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<a href="Account-Student.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px 0 8px; border-radius: 999px; background: #FDBA74; border: 2px solid #FDBA74; color: #7C2D12; font-weight: 700; font-size: 16px; text-decoration: none"><span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 999px; background: #FFF7ED; color: #7C2D12; font-weight: 800; font-size: 13px">EJ</span>Emma</a>
<a href="Main.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 2px solid #9A4A22; color: #7C2D12; font-weight: 700; font-size: 16px; text-decoration: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4"></path><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path></svg>Uitloggen</a>
</div>
</nav>
<main style="position: relative; flex: 1; width: 100%; max-width: 860px; margin: 0 auto; box-sizing: border-box; padding: 48px 32px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 6px">
<a href="Account-Student.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-weight: 700; font-size: 16px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Terug naar mijn account</a>
<h1 style="margin: 0; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 56px; line-height: 1.05; color: #C2410C; letter-spacing: 0.04em">INSTELLINGEN</h1>
</div>

<form aria-labelledby="h-profiel" style="background: #FFF7ED; border: 2px solid #FDBA74; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 16px">
<h2 id="h-profiel" style="margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9A4A22">Profiel</h2>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<div style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<label for="s-nick" style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9A4A22">Gebruikersnaam</label>
<input id="s-nick" maxlength="20" value="Emma" style="box-sizing: border-box; width: 100%; min-height: 54px; padding: 0 16px; border: 2px solid #FDBA74; border-radius: 14px; background: #FFFFFF; color: #7C2D12; font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 18px">
</div>
<div style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<label for="s-mail" style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9A4A22">E-mailadres</label>
<input id="s-mail" type="email" value="emma.jansen@student.hu.nl" style="box-sizing: border-box; width: 100%; min-height: 54px; padding: 0 16px; border: 2px solid #FDBA74; border-radius: 14px; background: #FFFFFF; color: #7C2D12; font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 18px">
</div>
</div>
<fieldset style="margin: 4px 0 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9A4A22; padding: 0; margin-bottom: 8px">Jouw vaardigheden (0–5)</legend>

<label style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 20px; align-items: center; gap: 12px; font-weight: 700; font-size: 16px">SD<input type="range" min="0" max="5" value="4" aria-label="SD" style="width: 100%; accent-color: #C2410C"><span style="text-align: right">4</span></label>

<label style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 20px; align-items: center; gap: 12px; font-weight: 700; font-size: 16px">AI<input type="range" min="0" max="5" value="2" aria-label="AI" style="width: 100%; accent-color: #C2410C"><span style="text-align: right">2</span></label>

<label style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 20px; align-items: center; gap: 12px; font-weight: 700; font-size: 16px">TI<input type="range" min="0" max="5" value="3" aria-label="TI" style="width: 100%; accent-color: #C2410C"><span style="text-align: right">3</span></label>

<label style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 20px; align-items: center; gap: 12px; font-weight: 700; font-size: 16px">CSC<input type="range" min="0" max="5" value="1" aria-label="CSC" style="width: 100%; accent-color: #C2410C"><span style="text-align: right">1</span></label>

<label style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 20px; align-items: center; gap: 12px; font-weight: 700; font-size: 16px">GD<input type="range" min="0" max="5" value="5" aria-label="GD" style="width: 100%; accent-color: #C2410C"><span style="text-align: right">5</span></label>

<label style="display: grid; grid-template-columns: 44px minmax(0, 1fr) 20px; align-items: center; gap: 12px; font-weight: 700; font-size: 16px">BI<input type="range" min="0" max="5" value="2" aria-label="BI" style="width: 100%; accent-color: #C2410C"><span style="text-align: right">2</span></label>

</fieldset>
<div style="display: flex; justify-content: flex-end">
<button type="button" onClick="() => this.setState({ saved: true })" style="display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 28px; border: 0; border-radius: 999px; background: #FDBA74; color: #7C2D12; font-family: 'Rubik', sans-serif; font-weight: 800; font-size: 18px; cursor: pointer">Opslaan</button>
</div>
</form>
<form aria-labelledby="h-pw" style="background: #FFF7ED; border: 2px solid #FDBA74; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 16px">
<h2 id="h-pw" style="margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9A4A22">Wachtwoord wijzigen</h2>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<div style="flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<label for="pw-old" style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9A4A22">Huidig wachtwoord</label>
<input id="pw-old" type="password" autocomplete="current-password" style="box-sizing: border-box; width: 100%; min-height: 54px; padding: 0 16px; border: 2px solid #FDBA74; border-radius: 14px; background: #FFFFFF; color: #7C2D12; font-size: 18px">
</div>
<div style="flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<label for="pw-new" style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9A4A22">Nieuw wachtwoord</label>
<input id="pw-new" type="password" autocomplete="new-password" style="box-sizing: border-box; width: 100%; min-height: 54px; padding: 0 16px; border: 2px solid #FDBA74; border-radius: 14px; background: #FFFFFF; color: #7C2D12; font-size: 18px">
</div>
</div>
<div style="display: flex; justify-content: flex-end">
<button type="button" style="display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 28px; border-radius: 999px; border: 2px solid #9A4A22; background: transparent; color: #7C2D12; font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 18px; cursor: pointer">Wachtwoord wijzigen</button>
</div>
</form>
<section aria-labelledby="h-del" style="border: 2px dashed #B91C1C; border-radius: 24px; padding: 28px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<h2 id="h-del" style="margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #991B1B">Account verwijderen</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.5">Je profiel en al je bewaarde scores worden gewist. Dit kun je niet ongedaan maken.</p>
</div>
<button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 24px; border-radius: 999px; border: 2px solid #B91C1C; background: #FFFFFF; color: #991B1B; font-family: 'Rubik', sans-serif; font-weight: 800; font-size: 17px; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>Verwijderen</button>
</section>
</main>
</div>
</body>
</html>
