# nginx in de frontend-container op de server (Dockerfile.frontend).
# Serveert de gebouwde site en stuurt de API en Socket.IO door naar de backend-container.

# Socket.IO begint als gewone HTTP-request en vraagt dan om een "Upgrade" naar WebSocket.
# Die vraag moet nginx doorgeven, anders valt Socket.IO terug op long-polling (werkt, maar trager).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 5173;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
  }

  location /socket.io/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    # Een open verbinding zonder berichten mag lang blijven staan (Socket.IO stuurt zelf pings).
    proxy_read_timeout 1h;
  }

  # Bestanden in /assets hebben een hash in hun naam (bijv. index-a1b2c3.js): ze veranderen nooit,
  # dus de browser mag ze lang bewaren. Een nieuwe versie krijgt een nieuwe naam.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # React Router regelt de pagina's in de browser. /join/123456 bestaat dus niet als bestand:
  # dan altijd index.html teruggeven. Die nooit cachen, anders zie je na een update de oude site.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
