<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Jouw plek quizfeest</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#46178F}
a{color:#FFFFFF}a:hover{color:#FFC00A}
</style>
</helmet>
<div style="min-height: 100vh; background: {{ground}}; color: #FFFFFF; font-family: 'Montserrat', sans-serif; display: flex; flex-direction: column; box-sizing: border-box">

<header style="background: #FFFFFF; color: #2F0F66; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 32px; font-weight: 800; font-size: 18px">
<span>Open ICT Quiz</span>
<span>PIN 482913</span>
</header>

<div style="flex: 1; width: 100%; max-width: 1200px; margin: 0 auto; padding: 40px 24px 48px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 48px">
<section aria-labelledby="jij" style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center">
<h1 id="jij" style="margin: 0; font-weight: 900; font-size: 30px">Klaar! Je eindigt op</h1>
<div style="background: #FFFFFF; color: #2F0F66; border-radius: 16px; box-shadow: 0 8px 0 #2F0F66; padding: 20px 56px; display: flex; flex-direction: column; align-items: center">
<span style="font-weight: 900; font-size: 140px; line-height: 1">{{me.rank}}e</span>
<span style="font-weight: 800; font-size: 22px">plaats van {{count}}</span>
</div>
<p style="margin: 8px 0 0; font-weight: 700; font-size: 22px">{{gapText}}</p>
<div style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<div style="background: #26890C; border-radius: 12px; box-shadow: 0 5px 0 #145206; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 4px">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 6"></path></svg>
<span style="font-weight: 900; font-size: 32px">{{me.correct}}</span><span style="font-weight: 700; font-size: 15px">goed</span>
</div>
<div style="background: #E21B3C; border-radius: 12px; box-shadow: 0 5px 0 #8C0F24; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 4px">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
<span style="font-weight: 900; font-size: 32px">{{me.wrong}}</span><span style="font-weight: 700; font-size: 15px">fout</span>
</div>
<div style="background: #1368CE; border-radius: 12px; box-shadow: 0 5px 0 #0A3E7D; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 4px">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4 6.5 20.3l1-6.2L3 9.7l6.2-.9z"></path></svg>
<span style="font-weight: 900; font-size: 32px">{{me.scoreText}}</span><span style="font-weight: 700; font-size: 15px">punten</span>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 8px">
<button type="button" style="min-height: 56px; padding: 0 28px; border: 0; border-radius: 10px; background: #FFC00A; color: #2F0F66; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 18px; box-shadow: 0 5px 0 #A87500; cursor: pointer">Account maken en score bewaren</button>
<button type="button" style="min-height: 56px; padding: 0 28px; border: 0; border-radius: 10px; background: #FFFFFF; color: #2F0F66; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 18px; box-shadow: 0 5px 0 #2F0F66; cursor: pointer">Terug naar start</button>
</div>
<p style="margin: 0; font-weight: 600; font-size: 15px">Als gast wordt je score na de quiz gewist.</p>
</section>

<section aria-labelledby="lijst" style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<h2 id="lijst" style="margin: 0 0 6px; font-weight: 900; font-size: 26px">Scorebord</h2>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<div style="display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 16px; background: {{r.bg}}; color: #2F0F66; border-radius: 10px; box-shadow: 0 4px 0 #2F0F66; font-size: 19px">
<span style="width: 34px; height: 34px; border-radius: 8px; background: #46178F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px">{{r.rank}}</span>
<span style="flex: 1; min-width: 0; font-weight: 800; overflow-wrap: anywhere">{{r.label}}</span>
<span style="font-weight: 800; font-variant-numeric: tabular-nums">{{r.scoreText}}</span>
</div>
</sc-for>
</section>
</div>

<footer style="background: #2F0F66; display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; font-weight: 900; font-size: 20px">
<span>{{me.nickname}}</span>
<span style="background: #FFFFFF; color: #2F0F66; padding: 6px 16px; border-radius: 6px">{{me.scoreText}}</span>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ground":{"editor":"color","default":"#46178F","options":["#46178F","#1368CE","#2F0F66"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const ground = this.props.ground ?? '#46178F';
    const results = [
      { id: 1, nickname: 'Sanne', score: 7420, correct: 8 },
      { id: 2, nickname: 'Daan', score: 5310, correct: 6 },
      { id: 3, nickname: 'Fatima', score: 6150, correct: 7 },
      { id: 4, nickname: 'Lucas', score: 2890, correct: 4 },
      { id: 5, nickname: 'Noah', score: 4480, correct: 5 },
      { id: 6, nickname: 'Mo', score: 6150, correct: 7 },
      { id: 7, nickname: 'Emma', score: 3720, correct: 5 },
      { id: 8, nickname: 'quizkoning', score: 1540, correct: 2 },
      { id: 9, nickname: 'Yara', score: 5880, correct: 7 },
      { id: 10, nickname: 'Tim_04', score: 0, correct: 0 }
    ];
    const meId = 7;
    const fmt = (n) => n.toLocaleString('nl-NL');
    const sorted = results.slice().sort((a, b) => b.score - a.score || a.nickname.localeCompare(b.nickname));
    const ranked = sorted.map((r) => ({ ...r, rank: sorted.findIndex((o) => o.score === r.score) + 1, scoreText: fmt(r.score) }));
    const m = ranked.find((r) => r.id === meId);
    const above = ranked.filter((r) => r.score > m.score).pop();
    const gapText = above ? fmt(above.score - m.score) + ' punten achter ' + above.nickname : 'Niemand had meer punten!';
    const rows = ranked.map((r) => ({
      ...r,
      label: r.id === meId ? r.nickname + ' (jij)' : r.nickname,
      bg: r.id === meId ? '#FFC00A' : '#FFFFFF'
    }));
    return { ground, me: { ...m, wrong: 8 - m.correct }, gapText, rows, count: ranked.length };
  }
}
</script>
</body>
</html>
