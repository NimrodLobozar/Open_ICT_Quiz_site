services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:3000
      # Windows/OneDrive geeft bestandswijzigingen niet door aan Docker,
      # dus Vite moet zelf regelmatig kijken (polling) voor live reload.
      VITE_USE_POLLING: "true"
    volumes:
      # Moet gelijk zijn aan WORKDIR in de Dockerfile, anders draait Vite
      # op de kopie uit de image en zie je je wijzigingen niet.
      - .:/home/node/app
      - /home/node/app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://quiz:quiz@db:5432/quiz
      NODE_ENV: development
    volumes:
      # Je backend-code live in de container, zodat nodemon wijzigingen ziet
      # zonder rebuild. node_modules blijft die uit de image.
      - ./backend:/app/backend
      - ./prisma:/app/prisma
      - ./prisma.config.ts:/app/prisma.config.ts
      - ./nodemon.json:/app/nodemon.json
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz
      POSTGRES_DB: quiz
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz -d quiz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
